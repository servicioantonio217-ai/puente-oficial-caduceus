stages:
  - lint
  - typecheck
  - test
  - build
  - package
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"

cache:
  key: v2-$CI_COMMIT_REF_SLUG
  paths:
    - .cache/pip
    - .cache/npm/

# --- Bridge (Python) ---

bridge:lint:
  stage: lint
  image: registry.access.redhat.com/ubi8/python-311
  before_script:
    - pip install ruff
  script:
    - cd bridge
    - ruff check src/ tests/
    - ruff format --check src/ tests/

bridge:typecheck:
  stage: typecheck
  image: registry.access.redhat.com/ubi8/python-311
  before_script:
    - cd bridge
    - pip install -e ".[dev]" > /dev/null
  script:
    - mypy src/
  allow_failure: true  # Strict mode — fix incrementally

bridge:test:
  stage: test
  image: registry.access.redhat.com/ubi8/python-311
  before_script:
    - cd bridge
    - pip install -e ".[dev]" > /dev/null
  script:
    - pytest tests/ -v

bridge:container:
  stage: build
  image: quay.io/podman/stable:latest
  variables:
    PODMAN_OPTS: --storage-driver=vfs --root /var/lib/containers/storage
  before_script:
    - podman $PODMAN_OPTS login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        podman $PODMAN_OPTS build \
          -t $CI_REGISTRY_IMAGE/bridge:$CI_COMMIT_TAG \
          -t $CI_REGISTRY_IMAGE/bridge:latest \
          ./bridge
        podman $PODMAN_OPTS push $CI_REGISTRY_IMAGE/bridge:$CI_COMMIT_TAG
        podman $PODMAN_OPTS push $CI_REGISTRY_IMAGE/bridge:latest
      else
        podman $PODMAN_OPTS build \
          -t $CI_REGISTRY_IMAGE/bridge:$CI_COMMIT_SHA \
          -t $CI_REGISTRY_IMAGE/bridge:latest \
          ./bridge
        podman $PODMAN_OPTS push $CI_REGISTRY_IMAGE/bridge:$CI_COMMIT_SHA
        podman $PODMAN_OPTS push $CI_REGISTRY_IMAGE/bridge:latest
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

# --- App (TypeScript) ---

app:lint:
  stage: lint
  image: registry.access.redhat.com/ubi9/nodejs-20
  variables:
    GIT_CLEAN_FLAGS: -ffdx
  before_script:
    - cd app && npm ci
  script:
    - npx eslint src/ --max-warnings 0

app:typecheck:
  stage: typecheck
  image: registry.access.redhat.com/ubi9/nodejs-20
  variables:
    GIT_CLEAN_FLAGS: -ffdx
  before_script:
    - cd app && npm ci
  script:
    - npx tsc --noEmit

app:test:
  stage: test
  image: registry.access.redhat.com/ubi9/nodejs-20
  variables:
    GIT_CLEAN_FLAGS: -ffdx
  before_script:
    - cd app && npm ci
  script:
    - npx vitest run --reporter=verbose

app:build:
  stage: build
  image: registry.access.redhat.com/ubi9/nodejs-20
  variables:
    GIT_CLEAN_FLAGS: -ffdx
  before_script:
    - cd app && npm ci
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" app.json
      fi
    - npm run build
  artifacts:
    paths:
      - app/dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

# --- App Package (.ehpk) ---

app:package:
  stage: package
  image: registry.access.redhat.com/ubi9/nodejs-20
  dependencies:
    - app:build
  variables:
    GIT_CLEAN_FLAGS: -ffdx
  before_script:
    - cd app && npm ci
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" app.json
        npx evenhub pack app.json dist -o caduceus-${CI_COMMIT_TAG}.ehpk
      else
        npx evenhub pack app.json dist -o caduceus.ehpk
      fi
  artifacts:
    paths:
      - app/*.ehpk
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

# --- Release (tag-only) ---

create:release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: bridge:container
    - job: app:package
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl git
  script:
    - echo "Preparing release assets for $CI_COMMIT_TAG"
    - git archive --format=zip --prefix=g2-caduceus-$CI_COMMIT_TAG/ -o source.zip HEAD
    - |
      curl --silent --show-error --fail \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file source.zip \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/g2-caduceus/${CI_COMMIT_TAG}/g2-caduceus-${CI_COMMIT_TAG}.zip"
    - |
      curl --silent --show-error --fail \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file app/caduceus-${CI_COMMIT_TAG}.ehpk \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/g2-caduceus/${CI_COMMIT_TAG}/caduceus-${CI_COMMIT_TAG}.ehpk"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: |
      ## G2 Caduceus ${CI_COMMIT_TAG}

      ### Bridge Server (Container)
      ```sh
      podman pull ${CI_REGISTRY_IMAGE}/bridge:${CI_COMMIT_TAG}
      ```

      ### Caduceus App
      Download the `.ehpk` asset below and sideload via Even Realities App.
    assets:
      links:
        - name: "Source Code (zip)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/g2-caduceus/${CI_COMMIT_TAG}/g2-caduceus-${CI_COMMIT_TAG}.zip"
          link_type: package
        - name: "Caduceus App (.ehpk)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/g2-caduceus/${CI_COMMIT_TAG}/caduceus-${CI_COMMIT_TAG}.ehpk"
          link_type: package

stages:
  - lint
  - typecheck
  - test
  - build
  - package

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"

cache:
  key: v2-$CI_COMMIT_REF_SLUG
  paths:
    - .cache/pip
    - .cache/npm/

# --- Bridge (Python) ---

bridge:lint:
  stage: lint
  image: registry.access.redhat.com/ubi8/python-311
  before_script:
    - pip install ruff
  script:
    - cd bridge
    - ruff check src/ tests/
    - ruff format --check src/ tests/

bridge:typecheck:
  stage: typecheck
  image: registry.access.redhat.com/ubi8/python-311
  before_script:
    - cd bridge
    - pip install -e ".[dev]" > /dev/null
  script:
    - mypy src/
  allow_failure: true  # Strict mode — fix incrementally

bridge:test:
  stage: test
  image: registry.access.redhat.com/ubi8/python-311
  before_script:
    - cd bridge
    - pip install -e ".[dev]" > /dev/null
  script:
    - pytest tests/ -v

bridge:container:
  stage: build
  image: quay.io/podman/stable:latest
  variables:
    CONTAINER_IMAGE: $CI_REGISTRY_IMAGE/bridge:$CI_COMMIT_SHA
    PODMAN_OPTS: --storage-driver=vfs --root /var/lib/containers/storage
  before_script:
    - podman $PODMAN_OPTS login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - podman $PODMAN_OPTS build -t $CONTAINER_IMAGE -t $CI_REGISTRY_IMAGE/bridge:latest ./bridge
    - podman $PODMAN_OPTS push $CONTAINER_IMAGE
    - podman $PODMAN_OPTS push $CI_REGISTRY_IMAGE/bridge:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# --- App (TypeScript) ---

app:lint:
  stage: lint
  image: registry.access.redhat.com/ubi9/nodejs-20
  variables:
    GIT_CLEAN_FLAGS: -ffdx
  before_script:
    - cd app && npm ci
  script:
    - npx eslint src/ --max-warnings 0

app:typecheck:
  stage: typecheck
  image: registry.access.redhat.com/ubi9/nodejs-20
  variables:
    GIT_CLEAN_FLAGS: -ffdx
  before_script:
    - cd app && npm ci
  script:
    - npx tsc --noEmit

app:test:
  stage: test
  image: registry.access.redhat.com/ubi9/nodejs-20
  variables:
    GIT_CLEAN_FLAGS: -ffdx
  before_script:
    - cd app && npm ci
  script:
    - npx vitest run --reporter=verbose

app:build:
  stage: build
  image: registry.access.redhat.com/ubi9/nodejs-20
  variables:
    GIT_CLEAN_FLAGS: -ffdx
  before_script:
    - cd app && npm ci
  script:
    - npm run build
  artifacts:
    paths:
      - app/dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# --- App Package (.ehpk) ---

app:package:
  stage: package
  image: registry.access.redhat.com/ubi9/nodejs-20
  dependencies:
    - app:build
  variables:
    GIT_CLEAN_FLAGS: -ffdx
  before_script:
    - cd app && npm ci --legacy-peer-deps
  script:
    - npx evenhub pack app.json dist -o caduceus.ehpk
  artifacts:
    paths:
      - app/caduceus.ehpk
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
